# Exported only with the frozen three-policy release manifest.
name: Publish frozen Track 2 candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-manifest.json
      - submission_candidates/**
      - .github/workflows/publish-candidates.yml
permissions:
  contents: read
concurrency:
  group: publish-track2-frozen
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'WaydeWan/AgenthonT2---ReasoningAugmentedTimeSeries---Money-Miner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Offline scaffold checks
        run: python3 -m unittest discover -s delivery/publish_scaffold_v1/tests -v
      - id: validate
        name: Validate frozen allowlist and exactly three configurations
        run: python3 delivery/publish_scaffold_v1/release.py matrix --manifest release-manifest.json --github-output "$GITHUB_OUTPUT"
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Stage only SHA-verified files
        env:
          CANDIDATE_ID: ${{ matrix.id }}
        run: python3 delivery/publish_scaffold_v1/release.py stage --manifest release-manifest.json --candidate "$CANDIDATE_ID" --out .release-context
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.23.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .release-context
          file: .release-context/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tag }}
          provenance: mode=min
          sbom: false
      - name: Record actual digest and configuration identity
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 delivery/publish_scaffold_v1/release.py record --manifest release-manifest.json --candidate "$CANDIDATE_ID" --digest "$IMAGE_DIGEST" --out build-record.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-record.json
          if-no-files-found: error
          retention-days: 30
